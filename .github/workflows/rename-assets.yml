name: rename-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git mv assets/mallow-ember-banner.mp4 assets/hero-banner.mp4
          git mv assets/mallow-welcome-rachel-squeaky.mp3 assets/mallow-welcome.mp3
          git commit -m "Demo assets: rename to hero-banner.mp4 + mallow-welcome.mp3"
          git push
