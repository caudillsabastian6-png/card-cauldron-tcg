<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c0b24" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:," />
<title>Check a card — camera (preview)</title>
<!-- Hark build, branch hark/home-screen. Live camera behind a card-shaped window,
     regular Arcane Lab theme around it, shutter button under the card. Front, then back, with creature guides.
     No verdict is shown: the photo goes on to the normal check flow. -->
<style>
  @font-face{font-family:"Nunito";src:url("Nunito.ttf") format("truetype");font-weight:200 1000;font-display:swap}
  :root{--plum-950:#1c0b24;--plum-900:#271133;--plum-800:#351747;--ink:#f7f0fb;--ink-soft:#d9c8e8;--ink-mute:#b39ec9;
    --gold:#f2c14e;--gold-deep:#d99e22;--gold-ink:#2a1a05;--red:#E8424A;--sun:#FFD84D;--line-soft:rgba(255,255,255,.10)}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--plum-950);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden}
  /* live feed fills the screen; the themed shade sits on top with a card-shaped hole */
  video,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #still{display:none}
  .shade{position:absolute;left:50%;top:var(--top);transform:translateX(-50%);width:var(--w);aspect-ratio:63/88;border-radius:18px;
    box-shadow:0 0 0 200vmax rgba(39,17,51,.96);pointer-events:none}
  .frame{position:absolute;left:50%;top:var(--top);transform:translateX(-50%);width:var(--w);aspect-ratio:63/88;border-radius:18px;
    border:3px solid rgba(255,255,255,.92);box-shadow:0 0 24px rgba(242,193,78,.35),inset 0 0 18px rgba(242,193,78,.18);pointer-events:none}
  .frame i{position:absolute;width:30px;height:30px;border:5px solid var(--sun)}
  .frame i:nth-child(1){left:-6px;top:-6px;border-right:0;border-bottom:0;border-top-left-radius:20px}
  .frame i:nth-child(2){right:-6px;top:-6px;border-left:0;border-bottom:0;border-top-right-radius:20px}
  .frame i:nth-child(3){left:-6px;bottom:-6px;border-right:0;border-top:0;border-bottom-left-radius:20px}
  .frame i:nth-child(4){right:-6px;bottom:-6px;border-left:0;border-top:0;border-bottom-right-radius:20px}
  .app{--w:min(72vw,330px);--top:calc(env(safe-area-inset-top) + 92px)}
  @media (max-height:700px){.app{--w:min(60vw,280px);--top:76px}}
  .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 16px) 16px 0;display:flex;align-items:center;gap:12px;z-index:3}
  .back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-soft);background:rgba(255,255,255,.08);color:var(--ink);font-size:22px;font-weight:900;display:grid;place-items:center;cursor:pointer}
  .top b{font-size:18px;font-weight:900;display:block;line-height:1.15}
  .top span{font-size:12.5px;color:var(--ink-mute);font-weight:700}
  .hint{position:absolute;left:0;right:0;top:calc(var(--top) + var(--w) * 88 / 63 + 14px);text-align:center;font-size:14px;font-weight:800;color:var(--ink-soft);z-index:3;padding:0 20px}
  .bar{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(env(safe-area-inset-bottom) + 26px);display:flex;align-items:center;justify-content:space-between;z-index:3}
  .side{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-soft);background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .side svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
  .shutter{width:82px;height:82px;border-radius:50%;border:5px solid #fff;padding:5px;background:transparent;cursor:pointer;box-shadow:0 10px 26px rgba(242,193,78,.4)}
  .shutter span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(180deg,#ffd873,var(--gold-deep))}
  .shutter:active span{transform:scale(.92)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}
  .flash.on{opacity:.85;transition:none}
  .review{position:absolute;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom) + 22px);display:none;gap:10px;z-index:3}
  .review button{flex:1;min-height:54px;border-radius:16px;font:inherit;font-size:16px;font-weight:900;cursor:pointer;border:1px solid var(--line-soft)}
  .retake{background:rgba(255,255,255,.08);color:var(--ink)}
  .use{background:linear-gradient(180deg,#ffd873,var(--gold-deep));color:var(--gold-ink);border:none}
  .app.taken .bar{display:none}.app.taken .review{display:flex}.app.taken #still{display:block}
  .nocam{position:absolute;left:50%;top:var(--top);transform:translateX(-50%);width:var(--w);aspect-ratio:63/88;display:none;place-items:center;text-align:center;padding:20px;font-size:14px;font-weight:800;color:var(--ink-soft);z-index:2;
    background:linear-gradient(160deg,var(--plum-800),var(--plum-900));border-radius:18px}
  .app.off .nocam{display:grid}
  input[type=file]{display:none}
  /* creature guide */
  .guide{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 128px);display:flex;align-items:flex-end;gap:8px;z-index:3;pointer-events:none}
  .guide img{width:82px;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));animation:gbob 3s ease-in-out infinite}
  .guide p{margin:0 0 18px;background:#fff;color:#271133;font-size:14px;font-weight:900;line-height:1.3;padding:10px 13px;border-radius:16px 16px 16px 4px;box-shadow:0 8px 18px rgba(0,0,0,.3);max-width:250px}
  .guide.pop img{animation:gpop .5s cubic-bezier(.3,1.6,.5,1),gbob 3s ease-in-out .5s infinite}
  .guide.pop p{animation:gpop .5s cubic-bezier(.3,1.6,.5,1) .1s both}
  @keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes gpop{0%{transform:scale(.3) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.guide img,.guide.pop img,.guide.pop p{animation:none}}
  @media (max-height:760px){.guide img{width:60px}.guide p{font-size:13px}}
  .steps{display:flex;gap:6px;margin-left:auto}
  .steps i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}.steps i.on{background:var(--sun)}
  .app.done .bar,.app.done .review{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="still"></canvas>
  <div class="nocam" id="nocam">Allow the camera to see your card live here.<br><br>Or tap the photo button to pick one.</div>
  <div class="shade"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>

  <div class="top">
    <button class="back" type="button" onclick="history.length>1?history.back():location.href='index.html'" aria-label="Back">‹</button>
    <div><b id="ttl">Check a card</b><span id="side">Step 1 of 2 · Front</span></div><div class="steps"><i class="on"></i><i id="s2"></i></div>
  </div>
  <p class="hint" id="hint">Line the card up inside the outline</p>

  <div class="bar">
    <label class="side" aria-label="Pick a photo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg><input type="file" accept="image/*" id="pick"></label>
    <button class="shutter" id="shoot" type="button" aria-label="Take picture"><span></span></button>
    <button class="side" id="torch" type="button" aria-label="Flash"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></button>
  </div>
  <div class="review"><button class="retake" id="retake" type="button">Retake</button><button class="use" id="use" type="button">Use photo</button></div>
  <div class="guide pop" id="guide"><img id="gimg" src="pets/zapkit.webp" alt=""><p id="gtxt">Hi! Put the front of your card in the outline, then tap the gold button.</p></div>
  <div class="flash" id="flash"></div>
</div>
<script>
(function(){
  "use strict";
  var app=document.getElementById("app"),v=document.getElementById("cam"),c=document.getElementById("still"),
      hint=document.getElementById("hint"),track=null,torchOn=false;
  function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){app.classList.add("off");return;}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})
      .then(function(s){v.srcObject=s;track=s.getVideoTracks()[0];app.classList.remove("off");})
      .catch(function(){app.classList.add("off");});
  }
  /* crop exactly what is inside the card outline */
  function cropFrom(src,sw,sh){
    var f=document.querySelector(".frame").getBoundingClientRect(),a=app.getBoundingClientRect();
    var scale=Math.max(a.width/sw,a.height/sh),ox=(a.width-sw*scale)/2,oy=(a.height-sh*scale)/2;
    var x=(f.left-a.left-ox)/scale,y=(f.top-a.top-oy)/scale,w=f.width/scale,h=f.height/scale;
    var out=document.createElement("canvas");out.width=Math.round(w);out.height=Math.round(h);
    out.getContext("2d").drawImage(src,x,y,w,h,0,0,out.width,out.height);
    c.width=a.width;c.height=a.height;var g=c.getContext("2d");g.drawImage(src,ox,oy,sw*scale,sh*scale);
    return out;
  }
  document.getElementById("shoot").onclick=function(){
    if(!v.videoWidth){document.getElementById("pick").click();return;}
    var fl=document.getElementById("flash");fl.classList.add("on");setTimeout(function(){fl.classList.remove("on");},60);
    window.cardPhoto=cropFrom(v,v.videoWidth,v.videoHeight);
    app.classList.add("taken");hint.textContent="Is the whole card sharp and inside the outline?";gt.textContent="Looks good? Tap Use photo, or Retake.";
  };
  document.getElementById("pick").onchange=function(e){
    var f=e.target.files[0];if(!f)return;var img=new Image();
    img.onload=function(){window.cardPhoto=cropFrom(img,img.naturalWidth,img.naturalHeight);app.classList.add("taken");hint.textContent="Is the whole card sharp and inside the outline?";gt.textContent="Looks good? Tap Use photo, or Retake.";};
    img.src=URL.createObjectURL(f);
  };
  document.getElementById("retake").onclick=function(){app.classList.remove("taken");hint.textContent="Line the card up inside the outline";gt.textContent=step===1?"No problem! Front of the card in the outline, then the gold button.":"No problem! Back of the card in the outline, then the gold button.";};
  var GRADE=/[?&]mode=grade/.test(location.search);if(GRADE){document.getElementById("ttl").textContent="Grade a card";document.title="Grade a card";}
  var step=1,G=document.getElementById("guide"),gi=document.getElementById("gimg"),gt=document.getElementById("gtxt");
  function guide(pet,txt){G.classList.remove("pop");void G.offsetWidth;gi.src="pets/"+pet+".webp";gt.textContent=txt;G.classList.add("pop");}
  window.cardPhotos={};
  document.getElementById("use").onclick=function(){
    if(step===1){window.cardPhotos.front=window.cardPhoto;step=2;app.classList.remove("taken");
      document.getElementById("side").textContent="Step 2 of 2 · Back";document.getElementById("s2").classList.add("on");
      hint.textContent="Line the back up inside the outline";
      guide("frostfin","Great shot! Now flip it over. Please take a picture of the back of the card.");}
    else{window.cardPhotos.back=window.cardPhoto;app.classList.add("done");
      hint.textContent="Both sides ready. In the app this goes on to the check.";
      guide("emberwyrm",GRADE?"All set! Let's see what it grades.":"All set! I'm checking your card now.");if(GRADE)setTimeout(function(){location.href="grade.html";},1400);}
  };
  document.getElementById("torch").onclick=function(){
    if(!track||!track.getCapabilities||!track.getCapabilities().torch){hint.textContent="This phone's browser doesn't allow the flash";return;}
    torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]});
  };
  start();
})();
</script>
</body>
</html>
